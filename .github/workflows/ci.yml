name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image digest as docker-compose.yml (postgres:16, C-07).
        image: postgres@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
        env:
          POSTGRES_USER: sma
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sma -d sma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials for the CI-only service container; tests derive `sma_test` from this.
      DATABASE_URL: postgres://sma:ci-only-password@localhost:5432/sma
      # CI never renders diagrams (only checks them), so skip puppeteer's Chrome download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/consumer/package-lock.json
      - run: npm ci
      # oasdiff, pinned by exact release + SHA-256 (must match apps/server/src/infra/oasdiff/version.ts).
      - name: Install oasdiff 1.35.0
        env:
          OASDIFF_VERSION: 1.35.0
          OASDIFF_SHA256: a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140
        run: |
          curl -fsSL -o /tmp/oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  /tmp/oasdiff.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/oasdiff.tar.gz -C "$HOME/.local/bin" oasdiff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/oasdiff" --version
      - run: npm run typecheck
      - run: npm run lint
      # API docs must build from a fresh checkout (the script builds @sma/core first).
      - run: npm run docs
      # Every class/state in docs/diagrams must still exist in the code.
      - run: npm run docs:check
      # Includes the Docker validator integration tests (AT-11); the runner has Docker.
      - run: npm test
      # The validator must leave the developer's repo and Docker clean (FR-20, NFR-06).
      - name: Validator left no changes or containers behind
        run: |
          git status --porcelain -- demo/consumer apps/server/test/fixtures
          test -z "$(git status --porcelain -- demo/consumer apps/server/test/fixtures)"
          test -z "$(docker ps --all --quiet --filter label=sma.validator=1)"
      # Migrations must also apply cleanly to a normal (non-test) database.
      - run: npm run db:migrate
      # Standalone sample consumer repo: must typecheck and pass against v1.
      # (consumer:test:v2 is expected to FAIL by design — failing-before rule, EV-02 — so it is not run here.)
      - run: npm run consumer:install
      - run: npm run consumer:typecheck
      - run: npm run consumer:test:v1
