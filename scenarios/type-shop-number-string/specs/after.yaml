openapi: 3.0.3
info:
  title: type-shop-number-string
  version: 2.0.0
servers:
  - url: https://api.example.test
paths:
  /orders/{id}:
    get:
      operationId: getTypeShopNumberString
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "42"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - total
                properties:
                  total:
                    type: string
              example:
                total: "12.5"
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
