openapi: 3.0.3
info:
  title: removed-weather-refuse
  version: 1.0.0
servers:
  - url: https://api.example.test
paths:
  /stations/{id}/history:
    get:
      operationId: getRemovedWeatherRefuse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "42"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - days
                properties:
                  days:
                    type: number
              example:
                days: 30
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
