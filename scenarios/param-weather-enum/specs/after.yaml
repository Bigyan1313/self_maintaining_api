openapi: 3.0.3
info:
  title: param-weather-enum
  version: 2.0.0
servers:
  - url: https://api.example.test
paths:
  /stations/{id}/forecast:
    get:
      operationId: getParamWeatherEnum
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "42"
        - name: units
          in: query
          required: true
          schema:
            type: string
            enum:
              - metric
              - imperial
          example: metric
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - temperature
                properties:
                  temperature:
                    type: number
              example:
                temperature: 21
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
