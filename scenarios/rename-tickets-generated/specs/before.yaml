openapi: 3.0.3
info:
  title: rename-tickets-generated
  version: 1.0.0
servers:
  - url: https://api.example.test
paths:
  /tickets/{id}:
    get:
      operationId: getRenameTicketsGenerated
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "42"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - event_name
                properties:
                  event_name:
                    type: string
              example:
                event_name: Concert
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
