openapi: 3.0.3
info:
  title: type-weather-timestamp
  version: 2.0.0
servers:
  - url: https://api.example.test
paths:
  /forecasts/{id}:
    get:
      operationId: getTypeWeatherTimestamp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "42"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - observed_at
                properties:
                  observed_at:
                    type: string
              example:
                observed_at: 2023-11-14T22:13:20.000Z
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
