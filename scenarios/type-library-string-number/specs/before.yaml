openapi: 3.0.3
info:
  title: type-library-string-number
  version: 1.0.0
servers:
  - url: https://api.example.test
paths:
  /books/{id}:
    get:
      operationId: getTypeLibraryStringNumber
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "42"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pages
                properties:
                  pages:
                    type: string
              example:
                pages: "320"
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
