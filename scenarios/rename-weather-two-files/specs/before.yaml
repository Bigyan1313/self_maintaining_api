openapi: 3.0.3
info:
  title: rename-weather-two-files
  version: 1.0.0
servers:
  - url: https://api.example.test
paths:
  /stations/{id}:
    get:
      operationId: getRenameWeatherTwoFiles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "42"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - station_name
                properties:
                  station_name:
                    type: string
              example:
                station_name: Austin
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
