openapi: 3.0.3
info:
  title: param-library-header
  version: 2.0.0
servers:
  - url: https://api.example.test
paths:
  /books:
    get:
      operationId: getParamLibraryHeader
      parameters:
        - name: x-library
          in: header
          required: true
          schema:
            type: string
          example: central
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: number
              example:
                count: 4
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
