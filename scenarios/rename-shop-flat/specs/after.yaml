openapi: 3.0.3
info:
  title: rename-shop-flat
  version: 2.0.0
servers:
  - url: https://api.example.test
paths:
  /customers/{id}:
    get:
      operationId: getRenameShopFlat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "42"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - full_name
                properties:
                  full_name:
                    type: string
              example:
                full_name: Ada
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
