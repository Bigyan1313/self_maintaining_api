openapi: 3.0.3
info:
  title: rename-fitness-destructure
  version: 2.0.0
servers:
  - url: https://api.example.test
paths:
  /workouts/{id}:
    get:
      operationId: getRenameFitnessDestructure
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "42"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - label
                properties:
                  label:
                    type: string
              example:
                label: Tempo
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
