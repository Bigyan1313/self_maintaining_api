openapi: 3.0.3
info:
  title: removed-fitness-refuse
  version: 1.0.0
servers:
  - url: https://api.example.test
paths:
  /sessions/{id}/ranking:
    get:
      operationId: getRemovedFitnessRefuse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "42"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - rank
                properties:
                  rank:
                    type: number
              example:
                rank: 7
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
