openapi: 3.0.3
info:
  title: type-tickets-boolean-enum
  version: 2.0.0
servers:
  - url: https://api.example.test
paths:
  /tickets/{id}:
    get:
      operationId: getTypeTicketsBooleanEnum
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "42"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                properties:
                  available:
                    type: string
                    enum:
                      - available
                      - unavailable
              example:
                available: unavailable
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
