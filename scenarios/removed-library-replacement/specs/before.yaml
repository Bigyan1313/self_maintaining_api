openapi: 3.0.3
info:
  title: removed-library-replacement
  version: 1.0.0
servers:
  - url: https://api.example.test
paths:
  /books/{id}/availability:
    get:
      operationId: getRemovedLibraryReplacement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "42"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - copies
                properties:
                  copies:
                    type: number
              example:
                copies: 2
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
