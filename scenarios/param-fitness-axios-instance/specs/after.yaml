openapi: 3.0.3
info:
  title: param-fitness-axios-instance
  version: 2.0.0
servers:
  - url: https://api.example.test
paths:
  /workouts:
    get:
      operationId: getParamFitnessAxiosInstance
      parameters:
        - name: level
          in: query
          required: true
          schema:
            type: string
            enum:
              - all
              - beginner
          example: all
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: number
              example:
                count: 2
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
